# ============================================================================
#  Per-service docker-compose.yml — chat-service.
#  Brings up ONLY the service container; the database lives in the SHARED
#  PostgreSQL instance from infra/ (logical DB `chatdb`). It does NOT run its
#  own Postgres — it connects to `postgres:5432` over the `career-net` network.
#
#  Prerequisite: the shared infra is already up (see infra/README.md) — the
#  `postgres`, `kafka`, `minio`, `redis` containers and the `career-net` network.
#
#  Run:
#     cd backend/chat-service
#     docker compose --env-file ../../.env up -d --build
#
#  --env-file ../../.env is needed for ${...} interpolation in THIS file AND so
#  that OPENAI_API_KEY from the root .env reaches the container. All ${...} have
#  defaults, so the service comes up even without the flag (but the assistant
#  needs OPENAI_API_KEY to generate real replies).
# ============================================================================
name: career-chat-service

services:
  chat-service:
    build: .
    container_name: career-chat-service
    env_file:
      - path: ../../.env       # root .env → JWT_SECRET, KAFKA_*, OPENAI_API_KEY…
        required: false        # not required: the defaults below allow it to come up without it
    environment:
      # Connect to the SHARED Postgres (database `chatdb`) and Kafka by their
      # internal docker names (`environment:` overrides `env_file:`).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:-career}@postgres:5432/chatdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # AUTH_MODE: gateway     # uncomment when the service runs behind an API Gateway
    ports:
      - "8004:8004"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8004"
    networks:
      - career-net

networks:
  career-net:
    external: true             # created by infra/docker-compose.yml
