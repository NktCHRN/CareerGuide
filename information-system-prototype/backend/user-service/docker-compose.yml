# ============================================================================
#  SAMPLE per-service docker-compose.yml — user-service.
#  Brings up ONLY the service container; the database lives in the SHARED
#  PostgreSQL instance from infra/ (logical DB `userdb`). The other services
#  follow this template, changing the build context, port, and DB name.
#
#  Prerequisite: the shared infra is already up (see infra/README.md) — the
#  `postgres`, `kafka`, `minio`, `redis` containers and the `career-net` network.
#
#  Run:
#     cd backend/user-service
#     docker compose --env-file ../../.env up -d --build
#
#  --env-file ../../.env is needed for ${...} interpolation in THIS file
#  (Compose looks for .env in the compose file's directory, while the shared
#  .env is in the repo root). All ${...} have defaults, so the service will
#  come up even without the flag.
# ============================================================================
name: career-user-service

services:
  user-service:
    build: .
    container_name: career-user-service
    env_file:
      - path: ../../.env       # root .env → JWT_SECRET, S3_*, OPENAI_*, SES_*, SEED_*…
        required: false        # not required: the defaults below allow it to come up without it
    environment:
      # Connect to the SHARED Postgres (database `userdb`) and the rest of the
      # infra by their internal docker names (`environment:` overrides `env_file:`).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:-career}@postgres:5432/userdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # AUTH_MODE: gateway     # uncomment when the service runs behind an API Gateway
    ports:
      - "8001:8001"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001"
    networks:
      - career-net

networks:
  career-net:
    external: true             # created by infra/docker-compose.yml
