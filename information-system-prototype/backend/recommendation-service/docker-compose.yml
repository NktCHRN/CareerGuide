# ============================================================================
#  Per-service docker-compose.yml — recommendation-service.
#  Brings up the recommendation WORKER (background Kafka consumer) AND the
#  recommendation-API (synchronous cosine ranking, port 8003). Both share the
#  SAME logical DB `recommendationdb` in the shared PostgreSQL instance from
#  infra/ (the worker owns the migrations; the api only reads). No own Postgres.
#
#  Prerequisite: the shared infra is already up (see infra/README.md) — the
#  `postgres`, `kafka`, `minio`, `redis` containers and the `career-net` network.
#
#  Run:
#     cd backend/recommendation-service
#     docker compose --env-file ../../.env up -d --build
#
#  Model checkpoints (worker/models) and ESCO/LiveCareer data (worker/data) are
#  mounted at runtime — place them there first (see worker/README.md). The
#  EmbeddingGemma + career-SBERT downloads are cached in the `hf-cache` volume.
#
#  GPU: this image installs the CPU torch wheel. For CUDA, rebuild the image on
#  an nvidia/cuda base with a matching torch wheel and add a `deploy.resources`
#  GPU reservation here — or simply run the worker locally with a GPU.
# ============================================================================
name: career-recommendation-service

services:
  worker:
    build: ./worker
    container_name: career-recommendation-worker
    env_file:
      - path: ../../.env       # root .env → KAFKA_*, S3_*, OPENAI_*, HF_TOKEN…
        required: false
    environment:
      # Connect to the SHARED Postgres (database `recommendationdb`) and the rest
      # of the infra by their internal docker names (overrides env_file).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:-career}@postgres:5432/recommendationdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./worker/models:/app/models      # CareerRNN checkpoint + industry vocab
      - ./worker/data:/app/data          # ESCO skills_en.csv + LiveCareer categories
      - hf-cache:/app/.hf-cache          # cached HF model downloads
    ports:
      - "8005:8005"                      # health only
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8005"
    networks:
      - career-net

  api:
    build: ./api
    container_name: career-recommendation-api
    env_file:
      - path: ../../.env       # root .env → JWT_SECRET, AUTH_MODE, CORS_ORIGINS…
        required: false
    environment:
      # Read-only access to the SHARED Postgres (database `recommendationdb`) and
      # Redis by their internal docker names (overrides env_file).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:-career}@postgres:5432/recommendationdb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8003:8003"
    # The api only reads; it needs the tables the worker creates via `alembic
    # upgrade head`. depends_on just orders container start — the worker runs the
    # migrations at boot (before its slow model loading), so the tables exist by
    # the time the api serves its first request.
    depends_on:
      - worker
    networks:
      - career-net

volumes:
  hf-cache:

networks:
  career-net:
    external: true             # created by infra/docker-compose.yml
