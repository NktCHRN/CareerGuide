# Alembic — recommendation-worker migrations (recommendationdb, pgvector).
# The worker OWNS this schema; recommendation-api only reads it.
# DATABASE_URL is taken from the environment/.env in alembic/env.py (not duplicated here).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set dynamically in env.py (settings.DATABASE_URL)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
