# ============================================================================
#  recommendation-worker (:8005 health only) — background Kafka consumer. Owns
#  the recommendationdb schema (migrations run in recommendation-migrate). On
#  profession.upserted it embeds professions (career-SBERT) into pgvector; on
#  user.profile.updated it builds the user vector (CareerRNN) and maps free-form
#  skills to ESCO (EmbeddingGemma). No HTTP API beyond /api/health.
#
#  Artifacts (CareerRNN checkpoint, industry vocab, ESCO/LiveCareer CSVs) are NOT
#  baked into the service image; an initContainer copies them from the
#  data-loader image onto emptyDir volumes (mirrors the compose bind-mounts).
#  HF model downloads (career-SBERT + EmbeddingGemma) are cached on a PVC.
#
#  GPU: this image installs the CPU torch wheel. For CUDA, rebuild the worker
#  image on an nvidia/cuda base + matching torch wheel, set DEVICE=cuda in
#  app-config, and add `resources.limits["nvidia.com/gpu"]: 1` below.
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-hf-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 8Gi } }   # career-SBERT + EmbeddingGemma weights
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-worker
  labels: { app: recommendation-worker }
spec:
  selector: { app: recommendation-worker }
  ports:
    - { name: health, port: 8005, targetPort: 8005 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-worker
spec:
  replicas: 1
  strategy: { type: Recreate }      # single ReadWriteOnce hf-cache PVC
  selector: { matchLabels: { app: recommendation-worker } }
  template:
    metadata:
      labels: { app: recommendation-worker }
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
          command: ["sh", "-c", "until pg_isready -h recommendationdb -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for recommendationdb; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
        # Copy the CareerRNN checkpoint/vocab and ESCO/LiveCareer CSVs onto the
        # emptyDir volumes the main container mounts at /app/models and /app/data.
        - name: load-artifacts
          image: careerguide/data-loader:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /seed/models/. /models/ && cp -a /seed/data/. /data/ && echo 'artifacts copied' && ls -la /models /data"]
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: data, mountPath: /data }
      containers:
        - name: recommendation-worker
          image: careerguide/recommendation-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: health, containerPort: 8005 }
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: RECO_DATABASE_URL } }
          volumeMounts:
            - { name: models, mountPath: /app/models }
            - { name: data, mountPath: /app/data }
            - { name: hf-cache, mountPath: /app/.hf-cache }
          readinessProbe:
            httpGet: { path: /api/health, port: 8005 }
            initialDelaySeconds: 20
            periodSeconds: 15
            # Model loading is slow; allow plenty of time before marking unready.
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /api/health, port: 8005 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "6Gi" }
      volumes:
        - name: models
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: hf-cache
          persistentVolumeClaim: { claimName: worker-hf-cache }
