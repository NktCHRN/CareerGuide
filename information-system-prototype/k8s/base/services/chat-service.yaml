# ============================================================================
#  chat-service (:8004) — OpenAI-backed career assistant. Keeps local copies of
#  professions/users from Kafka (profession-events, user-events). Tables are
#  created by the chat-migrate Job; this Deployment only serves.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  labels: { app: chat-service }
spec:
  selector: { app: chat-service }
  ports:
    - { name: http, port: 8004, targetPort: 8004 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: 1
  selector: { matchLabels: { app: chat-service } }
  template:
    metadata:
      labels: { app: chat-service }
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
          command: ["sh", "-c", "until pg_isready -h chatdb -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for chatdb; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: chat-service
          image: careerguide/chat-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8004 }
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: CHAT_DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /api/health, port: 8004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8004 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
