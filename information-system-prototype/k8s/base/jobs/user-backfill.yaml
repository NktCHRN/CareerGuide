# ============================================================================
#  user-backfill (OPTIONAL) — republishes every user profile to Kafka
#  (user-events / user.profile.updated) so the recommendation-worker recomputes
#  user vectors and ESCO skill mappings. Runs `python -m app.events.backfill_users`.
#  Useful after seeding or after rebuilding the worker; safe to skip on a fresh
#  cluster (the seeded users have empty profiles).
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: user-backfill
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: user-backfill }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
        - name: wait-for-db
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
          command: ["sh", "-c", "until pg_isready -h userdb -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for userdb; sleep 2; done"]
      containers:
        - name: backfill
          image: careerguide/user-service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.events.backfill_users"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: USER_DATABASE_URL } }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
