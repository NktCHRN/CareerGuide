# ============================================================================
#  recommendation-migrate — `alembic upgrade head` for recommendationdb (creates
#  the pgvector tables: profession_vectors, user_vectors). The worker owns this
#  schema; recommendation-api only reads. Run before the worker/api process events.
#  (The `vector` extension is also enabled by the recommendationdb initdb script.)
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: recommendation-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: recommendation-migrate }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
          command: ["sh", "-c", "until pg_isready -h recommendationdb -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for recommendationdb; sleep 2; done"]
      containers:
        - name: migrate
          image: careerguide/recommendation-worker:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: RECO_DATABASE_URL } }
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
