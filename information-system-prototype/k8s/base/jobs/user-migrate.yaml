# ============================================================================
#  user-migrate — `alembic upgrade head` for userdb (creates tables AND seeds the
#  admin + test user from the SEED_* values). Run before user-service serves.
#  Re-run: delete this Job and re-apply (Jobs are immutable; alembic is idempotent).
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: user-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: user-migrate }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
          command: ["sh", "-c", "until pg_isready -h userdb -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for userdb; sleep 2; done"]
      containers:
        - name: migrate
          image: careerguide/user-service:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }      # SEED_* + JWT for password hashing
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: USER_DATABASE_URL } }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
