# ============================================================================
#  chat-migrate — `alembic upgrade head` for chatdb (chats, messages, local
#  profession/user copies). Run before chat-service serves.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: chat-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: chat-migrate }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
          command: ["sh", "-c", "until pg_isready -h chatdb -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for chatdb; sleep 2; done"]
      containers:
        - name: migrate
          image: careerguide/chat-service:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: CHAT_DATABASE_URL } }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
