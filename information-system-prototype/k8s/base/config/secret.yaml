# ============================================================================
#  Secret values for CareerGuide.  These are DEV DEFAULTS (they match the root
#  .env.example) so `kubectl apply -k` works out of the box for a local cluster.
#  >>> ROTATE EVERYTHING before any non-local use. <<<
#
#  The per-service DATABASE_URL values embed POSTGRES_USER/POSTGRES_PASSWORD;
#  if you change the password, update the four *_DATABASE_URL keys too.
#  OPENAI_API_KEY / HF_TOKEN are empty by default: set them (HF_TOKEN is required
#  for the gated EmbeddingGemma model used by the recommendation-worker).
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # --- PostgreSQL ---
  POSTGRES_PASSWORD: "career"

  # --- Per-service DATABASE_URL (database-per-service; one Postgres StatefulSet each) ---
  USER_DATABASE_URL: "postgresql+asyncpg://career:career@userdb:5432/userdb"
  CAREER_DATABASE_URL: "postgresql+asyncpg://career:career@careerdb:5432/careerdb"
  CHAT_DATABASE_URL: "postgresql+asyncpg://career:career@chatdb:5432/chatdb"
  RECO_DATABASE_URL: "postgresql+asyncpg://career:career@recommendationdb:5432/recommendationdb"

  # --- JWT (HS256; issued only by user-service, validated by the gateway) ---
  JWT_SECRET: "change-me-dev-secret-rotate-in-prod"

  # --- OpenAI (resume parsing in worker, assistant in chat) ---
  OPENAI_API_KEY: ""

  # --- Hugging Face (gated EmbeddingGemma → required by the worker) ---
  HF_TOKEN: ""

  # --- S3 / MinIO ---
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"

  # --- AWS SES (only used when FEATURE_EMAIL_ENABLED=true) ---
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

  # --- Seeded initial accounts (user-service alembic seeding) ---
  SEED_ADMIN_EMAIL: "admin@career-guide.local"
  SEED_ADMIN_PASSWORD: "admin12345"
  SEED_ADMIN_NAME: "Administrator"
  SEED_USER_EMAIL: "user@career-guide.local"
  SEED_USER_PASSWORD: "user12345"
  SEED_USER_NAME: "Test User"
