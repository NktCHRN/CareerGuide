# ============================================================================
#  userdb — dedicated PostgreSQL StatefulSet for user-service (database-per-service).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: userdb
  labels: { app: userdb }
spec:
  clusterIP: None
  selector: { app: userdb }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: userdb
spec:
  serviceName: userdb
  replicas: 1
  selector: { matchLabels: { app: userdb } }
  template:
    metadata:
      labels: { app: userdb }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - { name: POSTGRES_DB, value: "userdb" }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d userdb"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
